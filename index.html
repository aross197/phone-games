<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phone Games – Play Instantly</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Phone Games</h1>
    <p>Instant HTML5 games that work great on mobile. No downloads.</p>
  </header>

  <main class="game-grid">
    <a href="snake.html" class="game-card">
      <div class="icon">🐍</div>
      <h2>Snake</h2>
      <p>Classic snake. Swipe to move.</p>
    </a>

    <a href="2048.html" class="game-card">
      <div class="icon">🔢</div>
      <h2>2048</h2>
      <p>Slide tiles. Reach 2048.</p>
    </a>

    <a href="pong.html" class="game-card">
      <div class="icon">🏓</div>
      <h2>Pong</h2>
      <p>One-player Pong. Touch to control.</p>
    </a>

    <a href="memory.html" class="game-card">
      <div class="icon">🃏</div>
      <h2>Memory</h2>
      <p>Match the pairs. Train your brain.</p>
    </a>
  </main>

  <footer>
    <p>Made for phones • Open source on <a href="https://github.com/aross197/phone-games" target="_blank">GitHub</a></p>
  </footer>
</body>
</html>
