<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake – Phone Games</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="game-page">
  <div class="game-header">
    <a href="index.html">← Back</a>
    <h1>Snake</h1>
    <div class="score" id="score">0</div>
  </div>

  <div class="game-container">
    <canvas id="game" width="360" height="360"></canvas>
  </div>

  <div class="controls">
    Swipe to move • Tap to restart when dead
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const GRID = 18;
    const CELL = canvas.width / GRID;

    let snake, dir, nextDir, food, score, alive, lastTime;

    function reset() {
      snake = [{x: 9, y: 9}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = score;
      alive = true;
      placeFood();
      lastTime = 0;
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function draw() {
      ctx.fillStyle = '#111118';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // food
      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath();
      ctx.roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
      ctx.fill();

      // snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#7c5cff' : '#5a3fd4';
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 3);
        ctx.fill();
      });

      if (!alive) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
        ctx.font = '16px Inter, sans-serif';
        ctx.fillText('Tap to restart', canvas.width/2, canvas.height/2 + 22);
      }
    }

    function update(time) {
      if (!alive) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      if (time - lastTime > 110) {
        lastTime = time;
        dir = nextDir;

        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // wall or self collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
            snake.some(s => s.x === head.x && s.y === head.y)) {
          alive = false;
        } else {
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            placeFood();
          } else {
            snake.pop();
          }
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    // Touch controls
    let startX, startY;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (!alive) {
        reset();
        return;
      }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (!alive || startX === undefined) return;

      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20 && dir.x !== -1) nextDir = {x: 1, y: 0};
        else if (dx < -20 && dir.x !== 1) nextDir = {x: -1, y: 0};
      } else {
        if (dy > 20 && dir.y !== -1) nextDir = {x: 0, y: 1};
        else if (dy < -20 && dir.y !== 1) nextDir = {x: 0, y: -1};
      }
      startX = startY = undefined;
    }, {passive: false});

    // Keyboard support
    window.addEventListener('keydown', e => {
      if (!alive) {
        if (e.key === ' ' || e.key === 'Enter') reset();
        return;
      }
      if (e.key === 'ArrowUp' && dir.y !== 1) nextDir = {x: 0, y: -1};
      if (e.key === 'ArrowDown' && dir.y !== -1) nextDir = {x: 0, y: 1};
      if (e.key === 'ArrowLeft' && dir.x !== 1) nextDir = {x: -1, y: 0};
      if (e.key === 'ArrowRight' && dir.x !== -1) nextDir = {x: 1, y: 0};
    });

    // click to restart
    canvas.addEventListener('click', () => {
      if (!alive) reset();
    });

    reset();
    requestAnimationFrame(update);
  </script>
</body>
</html>
